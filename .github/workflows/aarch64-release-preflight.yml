name: AArch64 release preflight

# A branch-runnable, no-publish rehearsal for the release workflow's Linux
# AArch64 binding artifacts. It is deliberately separate from release.yml:
# that workflow validates an immutable tag reachable from main, while this
# preflight must prove the unmerged branch on a real ARM64 runner.
on:
  push:
    paths:
      - .github/workflows/aarch64-release-preflight.yml
      - .github/workflows/release.yml
      - src/python/**
      - src/rust/**
      - src/ts/**
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-aarch64-artifacts:
    name: Build Linux AArch64 Python and N-API artifacts
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-unknown-linux-gnu
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: aarch64-unknown-linux-gnu
          args: --release --out dist --features pyo3/extension-module,default-embedder -i python3.10 python3.11 python3.12
          manylinux: "2_28"
          working-directory: src/python
      - name: Assert AArch64 wheel was built
        run: ls src/python/dist/*aarch64.whl
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "25.9.0"
      - name: Install TypeScript dependencies
        working-directory: src/ts
        run: npm ci
      - name: Build Linux AArch64 N-API binding
        working-directory: src/ts
        env:
          CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
        run: npm run build:native
      - name: Assert Linux AArch64 N-API binding was built
        run: test -f src/ts/fathomdb.linux-arm64-gnu.node
      - name: Stage and package Linux AArch64 N-API binding
        run: |
          cp src/ts/fathomdb.linux-arm64-gnu.node src/ts/npm/linux-arm64-gnu/
          cd src/ts/npm/linux-arm64-gnu
          npm pack --dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-python-dist-aarch64
          path: src/python/dist/*aarch64.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-napi-linux-arm64-gnu
          path: src/ts/npm/linux-arm64-gnu/fathomdb.linux-arm64-gnu.node
