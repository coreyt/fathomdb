version: 2
#
# Coverage reconciled 0.8.11.1 (Library Sweep #1, R-SW-5). The five entries below
# cover every SHIPPED/tracked manifest:
#   - pip  /src/python        (shipped Python package)
#   - cargo /                 (workspace root — covers all src/rust/crates/* members)
#   - npm  /src/ts            (TypeScript binding)
#   - npm  /                  (root markdown dev tooling — see R-DEP-2 note below)
#   - github-actions /        (all .github/workflows/*)
#
# Deliberately NOT covered (do NOT add — adding any of these reintroduces noise/orphans):
#   - /python  (uv-managed EVAL ENV; python/uv.lock is gitignored, not shipped). This is
#     the source of the idna/torch security-alert noise — keeping it uncovered is intentional.
#   - dev/research/**, data/corpus-data/** requirements*.txt  (eval/corpus fetch artifacts).
#   - dev/release/fixtures/cargo-skew/**  (intentional mock crates for release-skew tests).
#
# Dependabot PR creation is PAUSED by the five `open-pull-requests-limit: 0`
# entries below. Restore automatic updates in a dedicated dependency-maintenance
# change by removing them.
#
# Originally paused for the v0.8.20 registry recovery. That recovery COMPLETED
# (v0.8.20 is published; steward ledger seq-239), so the pause no longer rests
# on its original reason. It was carried onto `main` on 2026-08-04 by explicit
# HITL decision, as a standing posture rather than a recovery measure.
#
# ⚠ WHAT THIS COSTS. GitHub currently reports SIX open advisories on the default
# branch, TWO of them HIGH. Pausing PR creation does not silence the advisories
# themselves, but it does remove the automated pull requests that would
# otherwise surface and remediate them. While this pause stands, dependency
# advisories must be tracked and remediated MANUALLY. Re-check
# https://github.com/coreyt/fathomdb/security/dependabot before assuming the
# tree is current.
updates:
  - package-ecosystem: "pip"
    directory: "/src/python"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

  - package-ecosystem: "cargo"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/src/ts"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

  # 0.8.9 R-DEP-2: the root package-lock.json (repo-wide markdown dev tooling:
  # markdownlint-cli2 + prettier) carried open advisories (markdown-it
  # GHSA-6v5v-wf23-fmfq, js-yaml GHSA-h67p-54hq-rp68) but was under NO configured
  # directory, so its security PRs never auto-opened. The "/src/ts" entry above
  # covers only the TypeScript binding, not the root manifest.
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "weekly"
